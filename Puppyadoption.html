<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy adoption</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <p></p>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>    
    <p></p>
    please Note: First Name, Last Name, Password, and Email are required
    <p></p>
    <form method="get">

          <label for="FirstName">First Name:</label>
          <input type="text" name="FirstName" id="FirstName" placeholder="First Name" required>

          <label for="LastName">Last Name:</label>
          <input type="text" name="LastName" id="LastName" placeholder="Last Name" required>

          <p></p>

          <label for="email">Email:</label>
          <input type="email" name="Email" id="email" placeholder="name@email.com" required>

          <label for="pass">Password:</label>
          <input type="password"  name="Password" id="pass" required>

          
          <p>Are you over the age of 18?</p>
          <label for="yes">yes:</label>
          <input type="radio" name="over18" id="yes" value="over">

          <label for="no">no:</label>
          <input type="radio" name="over18" id="no" value="under">

          <p></p>
          <p>Do you have a Credit card or Paypal?</p>
          <select name="payment">
            <option value="creditcard">Credit card</option>
            <option value="paypal">Paypal</option>

          </select>

          <p></p>
          <input type="submit" name="Submmit" value="Submit Feedback">

          </form>
          





</body>
</html>
