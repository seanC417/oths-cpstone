<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bootstrap navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Four Seasons</a>
      </div>
    </nav>

   
    <nav class="navbar navbar-expand-lg bg-warning">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Seasons</a>
        <div class="navbar-nav">
          <a class="nav-link" href="https://en.wikipedia.org/wiki/Spring_(season)">Spring</a>
          <a class="nav-link" href="https://en.wikipedia.org/wiki/Summer">Summer</a>
          <a class="nav-link" href="https://en.wikipedia.org/wiki/Autumn">Autumn</a>
          <a class="nav-link" href="https://en.wikipedia.org/wiki/Winter">Winter</a>
        
        </div>
      </div>
    </nav>

    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">My Seasons Page</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#seasonsNavbar" aria-controls="seasonsNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="seasonsNavbar">
          <ul class="navbar-nav">

            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="https://en.wikipedia.org/wiki/Season">About Seasons</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Choose a Season</a>

              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="https://en.wikipedia.org/wiki/Spring_(season)">Spring</a></li>
                <li><a class="dropdown-item" href="https://en.wikipedia.org/wiki/Summer">Summer</a></li>
                <li><a class="dropdown-item" href="https://en.wikipedia.org/wiki/Autumn">Autumn</a></li>
                <li><a class="dropdown-item" href="https://en.wikipedia.org/wiki/Winter">Winter</a></li>
              </ul>
            </li>


          </ul>
        </div>
      </div>
    </nav>

    
    <h1 class="display-3 text-center">Which season you prefer?</h1>
    <div class="container text-center">
  <div class="row row-cols-2">
    <div class="col,border border-success p-3, border border-5" style="background-color:rgb(8, 255, 8)">
        Spring
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCEtlE8rnFXiMwooQNZAqEHYONs--SRpVmm3BY5RmVKg&s=10" width="200" height="300" alt="spring">
    </div>
    <div class="col,border border-danger p-3, border border-5" style="background-color:rgb(217, 77, 77)">
        Summer
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUFzhYytqkbzMOXETS1j9ZaG8IUurnt8VUwzm-IUPxgw&s=10" width="200" height="300" alt="summer">
    </div>
    <div class="col,border border-warning p-3, border border-5" style="background-color:rgb(187, 122, 2)">
        Autumn
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_uMNUaGaGMOklmJBDmeAzygiPRij6bTPGBx2G7vwciA&s=10" width="200" height="300" alt="autumn">
    </div>
    <div class="col,border border-primary p-3, border border-5" style="background-color:rgb(30, 144, 255)">
        Winter
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-epx4YakjUaF127bnxhXTWsQMJ3gqSZ8iSqyudiq2VQ&s=10" width="200" height="300" alt="winter">
    </div>
  </div>
</div>
