<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Athlete Club</title>
</head>

<body>

    <h1>Athlete Club</h1>

    <p>Join the greatest club for people who love doing sport.</p>

    <form method="get">

       
        <label for="name">Your Name:</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Enter your name"
               required>

        <br><br>

        
        <label for="email">Your Email:</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="example@email.com">

        <br><br>

       
        <p>do you like sports?</p>

        <label for="no">no</label>
        <input type="radio"
               id="no"
               name="no"
               value="no">

        <label for="yes">yes</label>
        <input type="radio"
               id="yes"
               name="yes"
               value="yes">

        <br><br>

        
        <label for="sport">what is your favorite sports:</label>

        <select id="sport" name="favrite_sport">
            <option value="sport">Basketball</option>
            <option value="sport">Soccer</option>
            <option value="sport">American football</option>
            <option value="sport">others...</option>
        </select>

        <br><br>

        
        <p>Why should we let you join?</p>

        <textarea
            placeholder="Convince us..."></textarea>

        <br><br>

        <input type="submit" value="Join the Athlete Club">

    </form>

</body>

</html>
