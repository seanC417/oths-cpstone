    <form id="fortune-form">

        
        <label for="question">Ask the fortune teller a question:</label>
        <p></p>
        <input
            type="text"
            id="question"
            name="question"
            required
        >

        <p></p>

        
        <label for="birthday">When is your birthday?</label>
        <p></p>
        <input
        
            type="date"
            id="birthday"
            name="birthday"
        >

        <p></p>

        <label for="color">Choose your lucky color:</label>
        <br>
        <input
            type="color"
            id="color"
            name="color"
        >

        <p></p>

       
        <label for="luck">How lucky do you feel?</label>
        <p></p>
        <input
            type="range"
            id="luck"
            name="luck"
            
        >

        <p></p>

        
        <label for="feeling">how are you feeling today?</label>
        <br>
        <select id="feeling" name="future">
            <option value="good">good</option>
            <option value="ok">ok</option>
            <option value="bad">bad</option>
        </select>

        <p></p>

       
        <label for="message">Tell the fortune teller something about yourself:</label>
        <p></p>
        <textarea
            id="message"
            name="message"
        ></textarea>

        <p></p>

        <button type="submit">Reveal My Fortune</button>

    </form>
